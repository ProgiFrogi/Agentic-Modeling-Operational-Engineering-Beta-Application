[project]
name = "kaggle_agent_system"
version = "0.1.0"
description = "Автономная мультиагентная система для соревнований Kaggle на LangGraph и MCP"
readme = "README.md"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.0.52",
    "langchain>=0.1.0",
    "langchain-openai>=0.0.2",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "docker>=7.0.0",  # Критично для безопасного выполнения кода
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "httpx>=0.25.0",  # Для MCP-клиента
    "websockets>=12.0",  # Для MCP-клиента
    "langchain-huggingface>=1.2.0",
    "transformers>=4.57.6",
    "torch>=2.10.0",
    "accelerate>=1.12.0",
    "mcp>=1.26.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "ipython>=8.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["F", "E", "W", "I", "B"]
